name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同分支连推时取消旧运行，省配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_WEB_URL: http://localhost:3000
          NEXT_PUBLIC_PROJECT_NAME: my-shipany-template
          AUTH_SECRET: ci-test-secret

  api-test:
    name: API Tests (all routes)
    runs-on: ubuntu-latest
    needs: test # 先过单测/构建，再花时间跑接口全量
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Restore supabase images cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-images
          # 滚动 key：每次 run 存自己的快照（key 不可变，固定 key 会把
          # 「部分拉取」的残缺缓存永久锁死）；restore-keys 取最近一份
          key: supabase-images-2.116.0-${{ github.run_id }}
          restore-keys: supabase-images-2.116.0-

      - name: Start local Supabase stack
        run: |
          # CI 用一次性的本地栈：迁移由 pnpm migrate 负责（项目唯一迁移口径），
          # private schema 暴露给 PostgREST（资金 RPC 走 supabase-js .schema("private")）
          # 不跑 supabase init：仓库已提交 supabase/config.toml（含 private schema
          # 暴露——资金/审批 RPC 走 .schema("private")），init --force 会用默认
          # 配置覆盖掉它（前几轮 CI 红的根因）
          # ECR Public 突发节流（toomanyrequests: Rate exceeded）：CLI 并行拉
          # 13 个镜像会撞限流。改为逐个预拉——优先 docker.io（限额宽松），失败再
          # 退回 ECR，本地 retag 成 CLI 期望的 ECR 名（compose pull policy=missing
          # 发现本地已有镜像即跳过拉取）
          DOCKERHUB_IMAGES="postgres:17.6.1.165 logflare:1.50.4 gotrue:v2.196.0 storage-api:v1.70.3 postgres-meta:v0.98.0 realtime:v2.129.3"
          ECR_IMAGES="postgrest:v16.1 kong:2.8.1 mailpit:v1.30.2"
          mkdir -p /tmp/supabase-images
          # 分源拉取：大镜像 Docker Hub 有同名 tag（匿名 100/6h 无压力）；
          # postgrest/kong/mailpit 仅 ECR 有（体积小，节流可退避扛过）。
          # 统一 retag 成 CLI 期望的 ECR 名（compose 本地有镜像即跳过拉取）
          pull_with_retry() {
            src="$1"; dst="$2"
            for backoff in 10 30 60 120 240; do
              if docker pull "$src"; then
                [ "$src" != "$dst" ] && docker tag "$src" "$dst"
                return 0
              fi
              echo "pull $src throttled, backoff ${backoff}s"
              sleep $backoff
            done
            return 1
          }
          FAIL_PULL=false
          for img in $DOCKERHUB_IMAGES $ECR_IMAGES; do
            ecr="public.ecr.aws/supabase/$img"
            docker image inspect "$ecr" > /dev/null 2>&1 && continue
            tar="/tmp/supabase-images/$(basename "$img" | tr ':.' '__').tar"
            if [ -f "$tar" ]; then docker load -i "$tar" && continue; fi
            if echo " $DOCKERHUB_IMAGES " | grep -q " $img "; then
              if pull_with_retry "docker.io/supabase/$img" "$ecr"; then
                docker save "$ecr" -o "$tar"
                continue
              fi
            fi
            if ! pull_with_retry "$ecr" "$ecr"; then
              echo "giving up on $img (banked progress saved)"
              FAIL_PULL=true
            else
              docker save "$ecr" -o "$tar"
            fi
          done
          if [ "$FAIL_PULL" = true ]; then
            exit 1
          fi
          for i in 1 2 3; do
            npx --yes supabase@2.116.0 start --ignore-health-check -x studio,imgproxy,inbucket,realtime,vector,analytics,edge-runtime,pooler && break
            echo "supabase start attempt $i failed, retrying in 90s…"
            npx supabase stop --no-backup 2>/dev/null || true
            sleep 90
            [ $i -eq 3 ] && exit 1
          done

      - name: Generate test env files
        # 测试 env 文件不入库（gitignore）；CI 从 supabase status 取回本地栈公开
        # 固定 key 并映射，其余凭据按次随机生成（测试自签自验）
        run: node scripts/gen-test-env.mjs api

      - name: Run migrations (fresh stack — instrumentation fail-fasts on pending)
        run: pnpm migrate

      - name: Restart postgrest (introspect private schema created by migrations)
        run: |
          docker restart supabase_rest_my-shipany-template
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:54321/rest/v1/) || true
            [ "$code" = "200" ] && { echo "postgrest healthy"; break; }
            sleep 2
          done

      - name: Run API tests (db reset + seed inside)
        run: pnpm api-test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api-tests/output/report-summary.md
            api-tests/output/report-summary.json
            api-tests/output/junit.xml
          retention-days: 30

      - name: Save supabase images cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-2.116.0-${{ github.run_id }}

      - name: Render summary to Job Summary
        if: always()
        run: |
          if [ -f api-tests/output/report-summary.md ]; then
            cat api-tests/output/report-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e-test:
    name: E2E Tests (all suites)
    runs-on: ubuntu-latest
    # 串行于 api-test：两个 job 并发起栈时 Docker Hub 拉镜像容易撞限流
    needs: [test, api-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Restore supabase images cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-images
          # 滚动 key：每次 run 存自己的快照（key 不可变，固定 key 会把
          # 「部分拉取」的残缺缓存永久锁死）；restore-keys 取最近一份
          key: supabase-images-2.116.0-${{ github.run_id }}
          restore-keys: supabase-images-2.116.0-

      - name: Start local Supabase stack
        # 与 api-test 同款一次性本地栈；迁移 0037 等由 pnpm e2e 的 webServer
        # 启动路径（lib/migrate）按 schema_migrations 增量应用
        run: |
          # 不跑 supabase init：仓库已提交 supabase/config.toml（含 private schema
          # 暴露——资金/审批 RPC 走 .schema("private")），init --force 会用默认
          # 配置覆盖掉它（前几轮 CI 红的根因）
          # ECR Public 突发节流（toomanyrequests: Rate exceeded）：CLI 并行拉
          # 13 个镜像会撞限流。改为逐个预拉——优先 docker.io（限额宽松），失败再
          # 退回 ECR，本地 retag 成 CLI 期望的 ECR 名（compose pull policy=missing
          # 发现本地已有镜像即跳过拉取）
          DOCKERHUB_IMAGES="postgres:17.6.1.165 logflare:1.50.4 gotrue:v2.196.0 storage-api:v1.70.3 postgres-meta:v0.98.0 realtime:v2.129.3"
          ECR_IMAGES="postgrest:v16.1 kong:2.8.1 mailpit:v1.30.2"
          mkdir -p /tmp/supabase-images
          # 分源拉取：大镜像 Docker Hub 有同名 tag（匿名 100/6h 无压力）；
          # postgrest/kong/mailpit 仅 ECR 有（体积小，节流可退避扛过）。
          # 统一 retag 成 CLI 期望的 ECR 名（compose 本地有镜像即跳过拉取）
          pull_with_retry() {
            src="$1"; dst="$2"
            for backoff in 10 30 60 120 240; do
              if docker pull "$src"; then
                [ "$src" != "$dst" ] && docker tag "$src" "$dst"
                return 0
              fi
              echo "pull $src throttled, backoff ${backoff}s"
              sleep $backoff
            done
            return 1
          }
          FAIL_PULL=false
          for img in $DOCKERHUB_IMAGES $ECR_IMAGES; do
            ecr="public.ecr.aws/supabase/$img"
            docker image inspect "$ecr" > /dev/null 2>&1 && continue
            tar="/tmp/supabase-images/$(basename "$img" | tr ':.' '__').tar"
            if [ -f "$tar" ]; then docker load -i "$tar" && continue; fi
            if echo " $DOCKERHUB_IMAGES " | grep -q " $img "; then
              if pull_with_retry "docker.io/supabase/$img" "$ecr"; then
                docker save "$ecr" -o "$tar"
                continue
              fi
            fi
            if ! pull_with_retry "$ecr" "$ecr"; then
              echo "giving up on $img (banked progress saved)"
              FAIL_PULL=true
            else
              docker save "$ecr" -o "$tar"
            fi
          done
          if [ "$FAIL_PULL" = true ]; then
            exit 1
          fi
          for i in 1 2 3; do
            npx --yes supabase@2.116.0 start --ignore-health-check -x studio,imgproxy,inbucket,realtime,vector,analytics,edge-runtime,pooler && break
            echo "supabase start attempt $i failed, retrying in 90s…"
            npx supabase stop --no-backup 2>/dev/null || true
            sleep 90
            [ $i -eq 3 ] && exit 1
          done

      - name: Generate test env files (both — db-reset needs .env.api-test)
        run: node scripts/gen-test-env.mjs all

      - name: Reset db (migrate + seed seed-user/bootstrap admin + admin state reset)
        # e2e 无 globalSetup——全新栈上 seed-user / bootstrap 管理员只能由
        # db-lifecycle（api-test:db-reset）种出；同时把管理员复位到临时密码
        # 未激活态，e2e fixtures 的激活回退分支才能接管（与本地 gate 同款交接）
        run: pnpm api-test:db-reset

      - name: Restart postgrest (introspect private schema created by migrations)
        run: |
          docker restart supabase_rest_my-shipany-template
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:54321/rest/v1/) || true
            [ "$code" = "200" ] && { echo "postgrest healthy"; break; }
            sleep 2
          done

      - name: Run E2E tests (3101 isolated server)
        run: pnpm e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            e2e-report-output/report-summary.md
            e2e-report-output/report-summary.json
            e2e-report-output/junit.xml
          retention-days: 30

      - name: Save supabase images cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-2.116.0-${{ github.run_id }}

      - name: Render summary to Job Summary
        if: always()
        run: |
          if [ -f e2e-report-output/report-summary.md ]; then
            cat e2e-report-output/report-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
