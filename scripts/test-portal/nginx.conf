server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 报告是持续覆盖写入的，禁缓存保证刷新即最新。
    # 统一用 root 模式（URI 直接拼到 root），不用 alias+正则嵌套（URI 拼接有坑）。
    location /reports/ {
        add_header Cache-Control "no-store";
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # history 目录清单以 JSON 输出，供门户渲染历史列表（纯静态方案，无需索引文件）
    location ~ ^/reports/history/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        autoindex on;
        autoindex_format json;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
